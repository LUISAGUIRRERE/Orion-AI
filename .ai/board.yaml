# Single Source of Truth for the composition of ORION OS's AI Board
# (MISSION G-012).
#
# This file is the canonical, machine-readable definition of *who* sits
# on the AI Board and what each seat is responsible/not responsible
# for. It does NOT replace the narrative documents:
#
#   - .ai/ROLES.md   -- full prose ("May" / "May not" / Boundaries) for
#                       each seat. Remains hand-written and authoritative;
#                       this file only mirrors short, structured summaries
#                       of the same already-approved facts, never new ones.
#   - .ai/prompts/*.md -- each AI member's actual system prompt.
#   - docs/DECISIONS.md -- ADRs recording *why* the Board looks like this
#                          (see ADR-0001, ADR-0006).
#
# Derived, generated documents (see orion/board/generator.py):
#   - The "Membership" table in .ai/BOARD.md
#   - The "AI Board" table in AGENTS.md
# Both are regenerated from this file by `orion board generate` and must
# never be hand-edited directly in their generated section.
#
# Adding or changing a member here is NOT, by itself, an approval to
# change who is on the Board -- that decision must already exist in an
# ADR (docs/DECISIONS.md) before this file is updated to reflect it.
# See "Adding or Updating an AI Board Member" in docs/BOARD_SOURCE_OF_TRUTH.md.

