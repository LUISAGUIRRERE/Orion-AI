<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION — The Window</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">ORION</div>
        <div class="topbar-info">
            <span id="clock">{{ current_date }} · {{ current_time }}</span>
            <span>{{ business_unit_count }} Business Units</span>
            <span>{{ event_count }} Eventos</span>
        </div>
    </header>

    <div class="layout">
        <nav class="sidebar">
            <a href="/">Dashboard</a>
            <a href="/#business-units">Business Units</a>
            <a href="/projects">Projects</a>
            <a href="/missions">Misiones</a>
            <a href="/intelligence">Intelligence</a>
            <a href="/companies">Empresas</a>
            <a href="/governance">Governance</a>
            <a href="/#eventos">Eventos</a>
        </nav>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/runtime.js"></script>
</body>
</html>
